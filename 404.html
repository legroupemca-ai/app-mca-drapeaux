<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Groupe MCA — Drapeaux Publicitaires</title>

<!--
  2026-08-24 — POURQUOI CE FICHIER EXISTE

  Le domaine legroupemca.com a ete branche sur l'app ce jour-la. Avant, l'app
  vivait a legroupemca-ai.github.io/app-mca-drapeaux/ et son manifest.json
  declarait start_url "/app-mca-drapeaux/". Sur le domaine racine ce chemin
  n'existe plus : GitHub Pages rend 404.

  Le manifest est corrige ("./"), MAIS une app DEJA INSTALLEE garde l'ancienne
  adresse copiee dans son raccourci — une correction serveur ne l'atteint pas.
  Christian l'a vu en direct sur Android : icone installee -> 404.

  Ce fichier rattrape TOUS les cas d'un coup, sans que personne reinstalle :
  toute adresse inconnue sous legroupemca.com renvoie a la racine, donc a l'app.
  Il couvre aussi les anciens liens en circulation (Meta, Messenger, cartes).

  ⛔ Le <meta refresh> est present EN PLUS du redirect JS : si le JS est bloque,
  la page doit quand meme partir. Et un lien visible reste en dernier recours,
  parce qu'un client qui voit une page blanche s'en va.
-->

<meta http-equiv="refresh" content="0; url=/">
<link rel="canonical" href="https://legroupemca.com/">
<script>location.replace("/" + location.hash);</script>

<style>

    display: inline-block; background: #CD0C18; color: #fff; text-decoration: none;
    padding: 13px 26px; border-radius: 10px; font-weight: 700; font-size: 15px;
  }
  a.alt { display: block; margin-top: 18px; color: rgba(255,255,255,.55); font-size: 13px; }
</style>
</head>
